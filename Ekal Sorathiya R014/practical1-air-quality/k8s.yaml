apiVersion: apps/v1
kind: Deployment
metadata:
  name: air-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: air-data
  template:
    metadata:
      labels:
        app: air-data
    spec:
      containers:
        - name: data
          image: air-data:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: air-data-svc
spec:
  type: ClusterIP
  selector:
    app: air-data
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: air-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: air-gateway
  template:
    metadata:
      labels:
        app: air-gateway
    spec:
      containers:
        - name: gateway
          image: air-gateway:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: air-gateway-svc
spec:
  type: ClusterIP
  selector:
    app: air-gateway
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: air-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: air-frontend
  template:
    metadata:
      labels:
        app: air-frontend
    spec:
      containers:
        - name: nginx
          image: air-frontend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: air-frontend-svc
spec:
  type: NodePort
  selector:
    app: air-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
