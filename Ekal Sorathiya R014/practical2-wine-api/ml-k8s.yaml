apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-model-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wine-model
  template:
    metadata:
      labels:
        app: wine-model
    spec:
      containers:
        - name: wine-api
          image: wine-classifier:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: wine-model-service
spec:
  type: NodePort
  selector:
    app: wine-model
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30510
